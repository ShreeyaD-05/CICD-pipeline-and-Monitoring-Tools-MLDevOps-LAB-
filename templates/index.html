<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iris Flower Predictor</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eaf2f8; margin: 0; padding: 30px; }
    .card { max-width: 460px; margin: auto; background: #fff; padding: 25px; border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.15); }
    h1 { color: #1f4e79; font-size: 24px; text-align: center; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { width: 100%; margin-top: 18px; padding: 10px; background: #1f4e79; color: #fff;
             border: 0; border-radius: 6px; font-size: 16px; cursor: pointer; }
    .result { margin-top: 18px; padding: 12px; background: #d4edda; border-radius: 6px; text-align: center; }
    .error { margin-top: 18px; padding: 12px; background: #f8d7da; border-radius: 6px; text-align: center; }
    small { display: block; text-align: center; margin-top: 15px; color: #555; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Iris Flower Predictor</h1>
    <form method="post" action="/predict">
      <label>Sepal length (cm)</label>
      <input type="number" step="0.1" name="sepal_length" value="{{ values[0] if values else 5.1 }}" required>
      <label>Sepal width (cm)</label>
      <input type="number" step="0.1" name="sepal_width" value="{{ values[1] if values else 3.5 }}" required>
      <label>Petal length (cm)</label>
      <input type="number" step="0.1" name="petal_length" value="{{ values[2] if values else 1.4 }}" required>
      <label>Petal width (cm)</label>
      <input type="number" step="0.1" name="petal_width" value="{{ values[3] if values else 0.2 }}" required>
      <button type="submit">Predict</button>
    </form>
    {% if species %}<div class="result">Predicted species: <b>{{ species }}</b></div>{% endif %}
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <small>Model accuracy on test data: {{ (accuracy * 100) | round(1) }}%</small>
  </div>
</body>
</html>
